[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-reliability"
version = "0.2.0"
description = "Reliability mathematics for agent workflows: counts in, credible intervals out."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Saumyajit Ghosh"}]
dependencies = ["numpy>=1.24"]
keywords = ["agents", "reliability", "markov-chain", "queueing", "uncertainty", "mcp"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://saumyajitghosh-collab.github.io/preflight/"
Source = "https://github.com/saumyajitghosh-collab/preflight"

[tool.setuptools]
packages = ["preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
